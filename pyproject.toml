[project]
name = "llm-chat-api"
version = "0.1.0"
description = "軽量 LLM 推論 API（FastAPI + Docker + 監視）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Hugging Face の小型モデルで実際に推論したい場合だけ入れる重い依存。
# 既定の echo バックエンドはこれ無しで動く。
hf = [
    "transformers>=4.46",
    "torch>=2.4",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-v --cov=app --cov-report=term-missing"
testpaths = ["tests"]
